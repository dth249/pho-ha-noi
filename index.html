#swap{top:calc(12px + env(safe-area-inset-top));right:12px;font-size:13px}
#clk{top:calc(12px + env(safe-area-inset-top));right:12px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;z-index:4}
#hint:empty{display:none}
#hint{top:calc(62px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.btn{position:fixed;border:0;border-radius:24px;font-weight:800;font-size:16px;color:#fff;padding:14px 22px;box-shadow:0 3px 8px #0004}
#act{position:fixed;z-index:6;display:none;left:50%;transform:translateX(-50%);bottom:calc(200px + env(safe-area-inset-bottom));border:0;border-radius:18px;background:#e0792f;color:#fff;font:800 15px sans-serif;padding:10px 18px;box-shadow:0 3px 10px rgba(0,0,0,.45);white-space:normal;text-align:center;width:max-content;max-width:84vw;line-height:1.25}#act.no{background:#7b8794}#act.run{background:#2e9b57}
#hold{position:fixed;z-index:6;display:none;left:14px;bottom:calc(60px + env(safe-area-inset-bottom));background:#fff;border-radius:16px;padding:6px 12px;font:800 13px sans-serif;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#mkb{position:fixed;z-index:6;display:none;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));border:0;border-radius:18px;background:#2e9b57;color:#fff;font:800 15px sans-serif;padding:10px 18px;box-shadow:0 3px 10px rgba(0,0,0,.45)}#menu{z-index:9}
#nbuy{position:fixed;z-index:6;display:none;transform:translate(-50%,0);border:0;border-radius:16px;background:#2e9b57;color:#fff;font:800 13px sans-serif;padding:6px 11px;box-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap}#nbuy.no{background:#8a98a4}
#build{right:14px;bottom:calc(30px + env(safe-area-inset-bottom));background:#2e9b57}
#buy{left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom));background:#e0432f;display:none;white-space:nowrap}
#joy{z-index:8;touch-action:none;position:fixed;left:0;top:0;opacity:0;pointer-events:none;transition:opacity .12s;width:112px;height:112px;border-radius:50%;background:#fff6;border:2px solid #fff9;box-sizing:border-box}#joy.on{opacity:1}
#joy::before{content:"";position:absolute;inset:-22px;border-radius:50%}#knob{pointer-events:none;position:absolute;width:48px;height:48px;border-radius:50%;background:#fffd;left:32px;top:32px;box-shadow:0 2px 4px #0003}
#menu{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center}
#menu .box{background:#fff;border-radius:18px;padding:16px;width:min(86vw,320px)}
#menu h3{margin:0 0 10px;font-size:17px}
#menu button{display:block;width:100%;margin-top:8px;padding:12px;border:0;border-radius:12px;background:#eef3e8;font-size:15px;font-weight:700;text-align:left}
#menu button small{display:block;font-weight:400;color:#555}
#menu button.x{background:#ddd;text-align:center}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;display:none;text-align:center;max-width:88vw}
#sel{position:fixed;inset:0;background:#8fdc6a;display:flex;flex-direction:column;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));touch-action:pan-y;z-index:5}
#sel>*{width:100%;max-width:560px}
#pv{flex:none;height:min(33vh,260px);text-align:center;position:relative}
#pv canvas{height:100%;width:auto;max-width:100%}
#pv .pb{position:absolute;top:4px;right:0;display:flex;flex-direction:column;gap:6px}
.sb{border:0;border-radius:16px;background:#fff;padding:7px 12px;font-size:13px;font-weight:700;color:#244018;box-shadow:0 2px 5px #0002}
#gen{flex:none;display:flex;gap:8px;margin:6px 0}
#gen button{flex:1;border:0;border-radius:14px;padding:10px;font-size:16px;font-weight:800;background:#ffffff80;color:#244018}
#gen button.on{background:#2e9b57;color:#fff}
