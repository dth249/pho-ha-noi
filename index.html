<style>
:root{
  --bg:#fffaf8;--card:#ffffff;--ink:#6b3a4e;--mute:#b48a9c;--acc:#ff6f9f;--acc2:#ff9dbf;
  --ok:#2fb98a;--bad:#f0506e;--line:#ffe4ee;--star:#ffb020;--shadow:#ff3f80;
  --tint:#fff5f8;--mid:#ffb3cc;--grad1:#ff8db5;--grad2:#ff5f97;--wood:#e8c9a0;--wood2:#d4a574;
  --f-title:"Baloo 2","Nunito",system-ui,sans-serif;--f-body:"Nunito","Baloo 2",system-ui,sans-serif;
  color-scheme:only light;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg)!important;color:var(--ink);font-family:var(--f-body);display:flex;justify-content:center;min-height:100vh;min-height:100dvh;-webkit-user-select:none;user-select:none;overflow-x:hidden}
button,input,textarea,select{font-family:inherit}
#app{width:100%;max-width:440px;padding:12px 14px 110px}
#app.shop-full{padding:0 0 72px;max-width:480px}
#app.shop-full .top{border-radius:0;margin:0;position:relative;top:0}
#app.shop-full .cust-bar{margin:0;border-radius:0;border-left:0;border-right:0;border-top:0;padding:6px 10px}
#app.shop-full .stall-wrap{margin:0;border:0;border-radius:0}
#app.shop-full .log{margin:0 10px;font-size:12px}
#app.shop-full h2{padding:10px 14px 0;margin:0}
h1,h2,h3,.top b,.money,.load-title{font-family:var(--f-title)}
button{font-family:var(--f-title);font-weight:600;border:0;border-radius:14px;padding:8px 12px;background:var(--line);color:var(--ink);cursor:pointer}
button:active{transform:scale(.96)}
button.pri{background:linear-gradient(var(--grad1),var(--grad2));color:#fff;width:100%;padding:14px;font-size:17px;margin-top:10px;box-shadow:0 4px 0 var(--shadow)}
button:disabled{opacity:.4}
.top{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff;border-radius:20px;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0);z-index:5;box-shadow:0 4px 0 var(--shadow)}
.top b{display:block;font-size:15px}.top small{opacity:.95;font-size:12px;font-weight:600;color:#1a1a1a}
.money{font-size:18px;font-weight:800;margin-left:auto}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
small,.mu{color:var(--mute)}
.g{color:var(--ok)}.r{color:var(--bad)}.st{color:var(--star)}
.moneybox{margin:8px auto 4px;width:fit-content;min-width:190px;text-align:center;background:var(--card);border:2px solid var(--mid);border-radius:16px;padding:5px 18px;font:800 20px var(--f-title);color:var(--ok);box-shadow:0 3px 0 var(--line)}
#tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:2px solid var(--line);border-radius:22px 22px 0 0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0));z-index:9}
#tabs button{flex:1;background:none;padding:6px 0 4px;font-size:10px;color:var(--mute);border-radius:12px;position:relative}
#tabs button span{display:block;font-size:24px;line-height:1.2}#tabs button.on{background:var(--line);color:var(--acc)}
#tabs button .bd{position:absolute;top:2px;right:calc(50% - 18px);background:var(--bad);color:#fff;border-radius:9px;min-width:16px;height:16px;font-size:10px;line-height:16px;padding:0 4px;font-weight:800}
.bub{max-width:88%;padding:8px 12px;border-radius:16px;margin:6px 0;font-size:14px;line-height:1.45;text-align:left}
.bub.c{background:var(--card);border:2px solid var(--line)}.bub.m{background:var(--acc);color:#fff;margin-left:auto}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);margin-top:6px;font-weight:600;padding:10px 12px}
.set-item{display:flex;align-items:center;gap:10px;background:var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;text-align:left}
.set-item .ico{font-size:20px;width:28px;text-align:center}
.set-item .lab{flex:1;font-weight:600;font-size:14px}
.set-item .val{font-size:12px;color:var(--mute);font-weight:500}
.set-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.28);border:0;font-size:16px;display:grid;place-items:center;flex:none;padding:0;color:#fff}
#modal{position:fixed;inset:0;background:rgba(80,20,50,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.mb{background:var(--card);border-radius:24px;padding:18px;max-width:400px;width:100%;text-align:center;max-height:92vh;overflow:auto}
.mb button.o{display:block;width:100%;padding:11px;margin-top:8px}
.mb button.main{background:linear-gradient(var(--grad1),var(--grad2));color:#fff;box-shadow:0 3px 0 var(--shadow)}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:14px;font-size:14px;z-index:30;display:none;max-width:90%}
.hero{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
.hero .big{font-size:72px}.hero h1{font-size:28px;margin:8px 0}
.sec-label{font-size:12px;font-weight:700;color:var(--mute);margin:10px 0 4px;font-family:var(--f-title)}
.bar{height:10px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--grad2));transition:width .25s}
.bar.pat i{background:linear-gradient(90deg,#2fb98a,#ffb020,#f0506e)}
input,textarea{font:inherit;width:100%;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;margin-bottom:6px;-webkit-user-select:text;user-select:text}
.chip{display:inline-block;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;margin:2px;color:#fff;background:var(--acc)}
.chip.g{background:var(--ok)}.chip.r{background:var(--bad)}

/* Loading */
#loading{position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,var(--tint),var(--line));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:opacity .45s}
#loading.hide{opacity:0;pointer-events:none}
.load-title{font-size:22px;font-weight:800;color:var(--ink);margin:16px 0 6px}
.load-sub{font-size:13px;color:var(--mute);margin-bottom:14px}
.candy-track{width:min(280px,80vw);height:22px;background:#fff;border-radius:12px;border:3px solid var(--grad1);overflow:hidden;box-shadow:0 3px 0 var(--mid)}
.candy-bar{height:100%;width:0%;border-radius:8px;background:repeating-linear-gradient(-45deg,var(--grad2) 0 10px,#fff 10px 20px,var(--grad1) 20px 30px,#fff 30px 40px);background-size:40px 100%;animation:candyMove .6s linear infinite;transition:width .15s}
@keyframes candyMove{from{background-position:0 0}to{background-position:40px 0}}
.load-pct{margin-top:10px;font-size:14px;font-weight:700;color:var(--acc)}

/* Stall */
.stall-wrap{background:#f5d5b8;border:2px solid var(--line);border-radius:16px;padding:0;margin:8px 0;overflow:hidden;position:relative}
.stall-canvas-box{position:relative;width:100%;line-height:0}
#stallCanvas{width:100%;height:auto;display:block;touch-action:manipulation;vertical-align:top}
.shop-full .stall-wrap{width:100%}
.shop-full #stallCanvas{width:100%;height:auto;display:block}
.clear-row{display:flex;gap:8px;padding:8px 12px;background:#fff5f0}
.clear-row button{flex:1}
.cust-wrap{background:#f8dcbc}
#mkCanvas{width:100%;height:auto;display:block;touch-action:manipulation;vertical-align:top}
.mk-wrap{background:#fdeed6}
#custCanvas{width:100%;height:auto;display:block;touch-action:manipulation;vertical-align:top}
.cust-hit{position:absolute;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:14px}
.stall-hit{position:absolute;border:2px solid transparent;border-radius:8px;cursor:pointer;z-index:2}
.stall-hit:active,.stall-hit.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,transparent)}
.stall-hit.empty{cursor:not-allowed}
.stall-qty{position:absolute;top:2px;right:2px;background:var(--acc);color:#fff;border-radius:8px;font-size:10px;padding:0 5px;font-weight:800;z-index:3;pointer-events:none;font-family:var(--f-title)}
.workbench{color:#6b3a4e;background:#f5e6d3;border:2px dashed var(--wood2);border-radius:16px;min-height:90px;margin:8px 0;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.workbench .bowl-view{font-size:42px;line-height:1}
.workbench .layers{font-size:13px;text-align:center;min-height:24px}
.cust-bar{background:linear-gradient(135deg,var(--tint),var(--line));border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.mk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mk-item{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.mk-item .em{font-size:32px}
.log{font-size:12px;color:var(--mute);line-height:1.6;max-height:80px;overflow:auto}
.credit{text-align:center;font-size:11px;color:var(--mute);margin-top:14px;line-height:1.5}
.set-item{display:flex;align-items:center;gap:10px;background:var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
html,body,*{touch-action:manipulation;-webkit-text-size-adjust:100%}

/* Theme picker */
.th-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.th-item{background:var(--tint);border:2px solid var(--line);border-radius:16px;padding:10px 4px 8px;font-size:13px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1.2}
.th-item.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.th-sw{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.75);box-shadow:0 0 0 1px var(--mid)}
#tabs button.home{flex:none;width:74px;height:auto;margin:-22px 2px 0;border-radius:16px;background:none;box-shadow:none;padding:2px 0 4px;color:var(--mute);display:block;align-self:flex-start}
#tabs button.home span{font-size:50px;line-height:1.05;display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
#tabs button.home.on{background:var(--line);box-shadow:none}
.cab{background:linear-gradient(90deg,#c79a63,#dcbc8c 50%,#c79a63);border:6px solid #8a5d2b;border-bottom:0;border-radius:12px 12px 0 0;padding:8px 6px 0;margin-bottom:12px;box-shadow:inset 0 0 14px rgba(90,50,10,.3)}
.shelf-row{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-items:end}
.shelf-cell{text-align:center;padding:4px 2px 2px;position:relative}
.shelf-cell .nm{font-size:11px;font-weight:700;color:#4b2d12;line-height:1.1;min-height:24px;display:flex;align-items:center;justify-content:center}
.shelf-cell .qt{position:absolute;top:0;right:4px;background:var(--acc);color:#fff;border-radius:9px;min-width:22px;padding:0 6px;font:800 12px/18px var(--f-title)}
.shelf-cell .qt.zero{background:#9a9a9a}
.shelf-cell button{font-size:10px;padding:2px 8px;border-radius:9px;background:rgba(255,255,255,.65);margin-bottom:3px}
.plank{height:12px;background:linear-gradient(#b98445,#94602a);border-radius:2px;margin:2px -6px 10px;box-shadow:0 3px 4px rgba(60,30,0,.35)}
.plank.last{margin-bottom:0;height:16px}
</style>
</head>

<script>
/* ===== ZOOM LOCK ===== */
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
document.addEventListener('touchmove',ev=>{if(ev.touches.length>1)ev.preventDefault()},{passive:false});
addEventListener('wheel',ev=>{if(ev.ctrlKey)ev.preventDefault()},{passive:false});
let _lastTap=0;
window.addEventListener('touchend',ev=>{
  if(ev.touches&&ev.touches.length>0)return;
  const n=Date.now(),ct=ev.changedTouches&&ev.changedTouches[0];
  const x=ct?ct.clientX:0,y=ct?ct.clientY:0;
  if(n-_lastTap>0&&n-_lastTap<450){
    if(ev.cancelable)ev.preventDefault();
    const t=document.elementFromPoint(x,y)||ev.target;
    if(t&&t.click&&!(t.matches&&t.matches('input,textarea,select,a,label')))t.click();
    _lastTap=0;return;
  }
  _lastTap=n;
},{passive:false,capture:true});
document.addEventListener('dblclick',ev=>ev.preventDefault(),{passive:false});
(function(){
  const opt={passive:false,capture:true};
  const stop=e=>{e.preventDefault()};
  ['gesturestart','gesturechange','gestureend'].forEach(n=>{window.addEventListener(n,stop,opt);document.addEventListener(n,stop,opt)});
  ['touchstart','touchmove'].forEach(n=>document.addEventListener(n,e=>{if((e.touches&&e.touches.length>1)||(e.scale&&e.scale!==1))e.preventDefault()},opt));
  const meta=document.querySelector('meta[name=viewport]');
  const LOCK='width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover';
  function relock(){if(meta)meta.setAttribute('content',LOCK)}
  function resetZoom(){
    const vv=window.visualViewport;
    if(vv&&Math.abs(vv.scale-1)>0.01){
      if(meta){meta.setAttribute('content',LOCK);setTimeout(relock,60)}
      window.scrollTo(0,window.scrollY);
    }
  }
  if(window.visualViewport){visualViewport.addEventListener('resize',resetZoom);visualViewport.addEventListener('scroll',()=>{if(Math.abs(visualViewport.scale-1)>0.01)resetZoom()})}
  relock();
})();
addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&['+','-','=','_','0'].includes(ev.key))ev.preventDefault()});

/* ===== PWA ===== */
const MANIFEST={name:"Phở Hà Lội",short_name:"Phở HL",start_url:".",display:"standalone",background_color:"#fff1f6",theme_color:"#ff8db5",icons:[{src:"Assets/logo-192.png",sizes:"192x192",type:"image/png"},{src:"Assets/icon-512.png",sizes:"512x512",type:"image/png"}]};
(function(){const b=new Blob([JSON.stringify(MANIFEST)],{type:"application/json"});const u=URL.createObjectURL(b);const l=document.createElement("link");l.rel="manifest";l.href=u;document.head.appendChild(l)})();
if("serviceWorker" in navigator){
  const sw=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>{e.respondWith(caches.open('pho-hn-v1').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(e.request.url.startsWith(self.location.origin))c.put(e.request,res.clone());return res}).catch(()=>caches.match('./')))))})`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"application/javascript"}))).catch(()=>{});
}

/* ===== DATA ===== */
const SAVE_KEY='pho_ha_loi_v1';
const ITEMS=[
  {id:'bat',n:'Bát',n_en:'Bowl',e:'🥣',c:1200,kind:'ut'},
  {id:'dua',n:'Đũa',n_en:'Chopsticks',e:'🥢',c:600,kind:'ut'},

  {id:'nd_bo',n:'Nước dùng bò',n_en:'Beef broth',e:'🍲',c:3500,kind:'broth'},

  {id:'nd_dac',n:'Nước dùng đặc biệt',n_en:'Special broth',e:'🍲',c:4500,kind:'broth'}
];
const MENU=[
  {id:'pho_bo',n:'Phở bò',n_en:'Beef pho',e:'🍜',broth:'nd_bo',need:['pho'],opt:['hanh','quay','hat_nem','duong','bot_ngot','nuoc_mam'],priceDef:45000,unlock:1},
  {id:'pho_ga',n:'Phở gà',n_en:'Chicken pho',e:'🍜',broth:'nd_ga',need:['pho'],opt:['hanh','quay','hat_nem','duong','bot_ngot','nuoc_mam'],priceDef:42000,unlock:4},

function unlockedMenus(){return MENU.filter(isMenuUnlocked)}

/* Sự kiện ngày — giống tiệm buffet */
const DAY_EVENTS=[
  {id:'rush',n:'Giờ cao điểm 🔥',n_en:'Rush hour 🔥',d:'Khách đông gấp rưỡi!',d_en:'1.5× more guests!',spawn:1.5,tip:1,priceMul:1},

}

}

function makeOrder(){
  const pool=unlockedMenus();
  const m=rnd(pool.length?pool:[MENU[0]]);
  const extras=[];
  m.opt.forEach(id=>{if(Math.random()<.35&&(S.stock[id]||0)>0)extras.push(id)});
  if(m.id==='pho_dac'&&!extras.includes('tom')&&(S.stock.tom||0)>0&&Math.random()<.7)extras.push('tom');
  const order={menuId:m.id,broth:m.broth,need:[...m.need],extras,label:menuN(m)};
  order.desc=orderDesc(order);
  return order;
}
function orderDesc(o){
  if(!o)return '';
  const parts=[menuN(MENU.find(m=>m.id===o.menuId)||{n:o.label})];
  const ex=[];
  (o.extras||[]).forEach(id=>{
    const it=findItem(id);
    if(!it)return;
    if(id==='quay')ex.push(currentLang==='en'?'+1 fried dough':'+ 1 quẩy');
    else if(id==='hanh')ex.push(currentLang==='en'?'with green onion':'có hành');
    else if(id==='tom')ex.push(currentLang==='en'?'with shrimp':'có tôm');
    else if(id==='hat_nem')ex.push(currentLang==='en'?'seasoning':'hạt nêm');
    else if(id==='duong')ex.push(currentLang==='en'?'sugar':'đường');
    else if(id==='bot_ngot')ex.push(currentLang==='en'?'MSG':'bột ngọt');
    else if(id==='nuoc_mam')ex.push(currentLang==='en'?'fish sauce':'nước mắm');
    else ex.push(itemN(it));
  });
  if(ex.length)parts.push(ex.join(' · '));
  return parts.join(' · ');
}

/* ===== BOWL ASSEMBLY ===== */
function emptyBowl(){return {bat:false,pho:false,tom:false,hanh:false,quay:false,hat_nem:false,duong:false,bot_ngot:false,nuoc_mam:false,broth:null,dua:false,muong:false}}
function bowlLayers(b){
  if(!b||!b.bat)return [];
  const L=[];
  if(b.pho)L.push('pho');
  if(b.tom)L.push('tom');
  if(b.hanh)L.push('hanh');
  if(b.quay)L.push('quay');
  if(b.broth)L.push('broth');
  if(b.dua)L.push('dua');
  if(b.muong)L.push('muong');
  return L;
}
/** Vẽ tô phở xếp lớp — không dùng icon emoji */
function drawPhoBowl(ctx, cx, cy, sc, b){
  if(!b||!b.bat){
    // thớt trống — không vẽ đĩa
    return;
  }
  const brothCol={
    nd_thuong:'#c5e1a5', nd_bo:'#8d6e63', nd_ga:'#ffe0b2', nd_dac:'#ef6c00'
  };
  // bóng dưới bát
  ctx.fillStyle='rgba(0,0,0,0.14)';
  ctx.beginPath();ctx.ellipse(cx,cy+52*sc,42*sc,11*sc,0,0,Math.PI*2);ctx.fill();

  // === THÂN BÁT (sâu, không phẳng như đĩa) ===
  // thành ngoài
  const side=ctx.createLinearGradient(cx-50*sc,cy,cx+50*sc,cy);
  side.addColorStop(0,'#f0e8e4');side.addColorStop(0.5,'#fffefb');side.addColorStop(1,'#e8ddd8');
  ctx.fillStyle=side;
  ctx.beginPath();
  // miệng trên (rộng)
  ctx.moveTo(cx-50*sc, cy-6*sc);
  // thành trái cong xuống đáy
  ctx.bezierCurveTo(cx-54*sc,cy+18*sc, cx-42*sc,cy+48*sc, cx-22*sc,cy+54*sc);
  // đáy tròn
  ctx.quadraticCurveTo(cx, cy+60*sc, cx+22*sc, cy+54*sc);
  // thành phải lên
  ctx.bezierCurveTo(cx+42*sc,cy+48*sc, cx+54*sc,cy+18*sc, cx+50*sc, cy-6*sc);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#c9a090';ctx.lineWidth=2*sc;ctx.stroke();

  // vành miệng dày (nhìn 3D)
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(cx, cy-6*sc, 50*sc, 15*sc, 0, 0, Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d4a8a0';ctx.lineWidth=2*sc;ctx.stroke();
  // vành trong
  ctx.strokeStyle='#e8b8b0';ctx.lineWidth=1.5*sc;
  ctx.beginPath();ctx.ellipse(cx, cy-6*sc, 42*sc, 11*sc, 0, 0, Math.PI*2);ctx.stroke();
  // họa tiết hoa đỏ trong lòng
  ctx.strokeStyle='#e07080';ctx.lineWidth=1.3*sc;
  ctx.beginPath();ctx.ellipse(cx, cy-6*sc, 28*sc, 7*sc, 0, 0, Math.PI*2);ctx.stroke();
  // chấm hoa nhỏ
  ctx.fillStyle='#e07080';
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3;
    ctx.beginPath();
    ctx.arc(cx+Math.cos(a)*22*sc, cy-6*sc+Math.sin(a)*5.5*sc, 1.8*sc, 0, Math.PI*2);
    ctx.fill();
  }

  // lòng bát sâu (mặt nước / nền)
  ctx.fillStyle='#f5f0ec';
  ctx.beginPath();ctx.ellipse(cx, cy+2*sc, 36*sc, 10*sc, 0, 0, Math.PI*2);ctx.fill();

  // 1. bánh phở — sợi nằm trong lòng
  if(b.pho){
    ctx.strokeStyle='#efe8dc';ctx.lineWidth=2.4*sc;ctx.lineCap='round';
    for(let i=0;i<10;i++){
      const ox=(i-4.5)*4.2*sc;
      ctx.beginPath();
      ctx.moveTo(cx+ox-6*sc, cy-2*sc);
      ctx.quadraticCurveTo(cx+ox+3*sc, cy+10*sc, cx+ox-4*sc, cy+20*sc);
      ctx.stroke();
    }
    ctx.strokeStyle='#e0d8c8';ctx.lineWidth=1.8*sc;
    for(let i=0;i<7;i++){
      const ox=(i-3)*5*sc;
      ctx.beginPath();
      ctx.moveTo(cx+ox+5*sc, cy);
      ctx.quadraticCurveTo(cx+ox-2*sc, cy+12*sc, cx+ox+6*sc, cy+18*sc);
      ctx.stroke();
    }
  }

  // 2. tôm
  if(b.tom){
    for(let i=0;i<3;i++){
      const ox=(i-1)*13*sc, oy=6*sc+i*2*sc;
      ctx.fillStyle='#ff8a65';
      ctx.beginPath();ctx.ellipse(cx+ox,cy+oy,8*sc,4.5*sc,0.25,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffe0d0';
      ctx.beginPath();ctx.ellipse(cx+ox-2*sc,cy+oy-1*sc,2.5*sc,1.8*sc,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#e64a19';ctx.lineWidth=1.4*sc;
      ctx.beginPath();ctx.moveTo(cx+ox+6*sc,cy+oy);ctx.lineTo(cx+ox+10*sc,cy+oy-3*sc);ctx.stroke();
    }
  }

  // 3. hành
  if(b.hanh){
    ctx.strokeStyle='#66bb6a';ctx.lineWidth=1.7*sc;ctx.lineCap='round';
    for(let i=0;i<7;i++){
      const a=(i/7)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*6*sc, cy+Math.sin(a)*2*sc+4*sc);
      ctx.quadraticCurveTo(cx+Math.cos(a)*12*sc, cy+Math.sin(a)*4*sc-2*sc, cx+Math.cos(a)*16*sc, cy+Math.sin(a)*5*sc-6*sc);
      ctx.stroke();
    }
  }

  // 4. nước dùng — đổ trong lòng bát
  if(b.broth){
    const col=brothCol[b.broth]||'#d7ccc8';
    ctx.globalAlpha=0.65;
    ctx.fillStyle=col;
    ctx.beginPath();ctx.ellipse(cx, cy+4*sc, 34*sc, 9*sc, 0, 0, Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.3;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(cx-10*sc, cy+1*sc, 14*sc, 4*sc, 0, 0, Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }

  // 5. quẩy dựa thành bát
  if(b.quay){
    ctx.fillStyle='#ffcc80';
    ctx.save();
    ctx.translate(cx+38*sc, cy-2*sc);
    ctx.rotate(-0.45);
    rr(ctx,-4*sc,-16*sc,8*sc,32*sc,3*sc);ctx.fill();
    ctx.fillStyle='#ffe0b2';rr(ctx,-2*sc,-14*sc,4*sc,28*sc,2*sc);ctx.fill();
    ctx.restore();
  }

  // 6. đũa cắm / gác
  if(b.dua){
    ctx.strokeStyle='#5d4037';ctx.lineWidth=2.6*sc;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(cx-18*sc,cy-28*sc);ctx.lineTo(cx+28*sc,cy+10*sc);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-14*sc,cy-32*sc);ctx.lineTo(cx+32*sc,cy+6*sc);ctx.stroke();
  }

  // 7. muỗng
  if(b.muong){
    ctx.fillStyle='#b0bec5';
    ctx.beginPath();ctx.ellipse(cx-26*sc,cy-8*sc,7*sc,4.5*sc,0.35,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#90a4ae';ctx.lineWidth=2*sc;
    ctx.beginPath();ctx.moveTo(cx-20*sc,cy-6*sc);ctx.lineTo(cx-6*sc,cy+10*sc);ctx.stroke();
  }
}

function paintBowlPreview(){
  const c=document.getElementById('bowlCanvas');
  if(!c||!L)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=c.clientWidth||280,h=160;
  c.width=w*dpr;c.height=h*dpr;
  const ctx=c.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  // nền thớt
  ctx.fillStyle='#e8c9a0';
  rr(ctx,8,8,w-16,h-16,12);ctx.fill();
  ctx.strokeStyle='#c4a070';ctx.lineWidth=2;ctx.stroke();
  drawPhoBowl(ctx,w/2,h/2+6,1.15,L.bowl);
}

function matchOrder(bowl,order){
  if(!bowl.bat||!bowl.pho||!bowl.broth||!bowl.dua)return false;
  if(bowl.broth!==order.broth)return false;
  // required
  for(const id of order.need){if(id==='pho'){if(!bowl.pho)return false}else if(!bowl[id])return false}
  // extras: if customer asked, must have; extra unrequested spices ok lightly
  for(const id of order.extras){if(!bowl[id])return false}
  // wrong broth already checked; shrimp on non-special without request is ok if not conflicting
  return true;
}



/* ===== STALL CANVAS — vẽ thuần, không ảnh ngoài ===== */
// Vùng % (x,y,w,h) — hotspot bấm
function stockQ(id){return (S.stock&&S.stock[id])||0}
function rr(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

/** Vẽ topping lên ảnh bát (không vẽ lại thân bát) */
function drawBowlLayersOnAsset(ctx, ox, oy, k, b){
  // (ox,oy) = góc trên-trái ảnh bát, k = tỉ lệ so với ảnh gốc 522×478
  // Chỉ hiển thị: nước dùng trong bát, đôi đũa, cái muỗng (sợi phở & topping không vẽ nữa)
  if(!b)return;
  const P=(x,y)=>[ox+x*k,oy+y*k];
  const brothCol={nd_thuong:['#eef3cf','#c9d88f'],nd_bo:['#b98f70','#7d5439'],nd_ga:['#fff0cf','#f2c67c'],nd_dac:['#ff9d4d','#d9520f']};
  if(b.broth){
    const [cx,cy]=P(262,198);
    const cols=brothCol[b.broth]||['#e0d0c0','#b8a090'];
    const gr=ctx.createRadialGradient(cx,cy-8*k,6*k,cx,cy,112*k);
    gr.addColorStop(0,cols[0]);gr.addColorStop(1,cols[1]);
    ctx.fillStyle=gr;
    ctx.beginPath();ctx.ellipse(cx,cy,104*k,50*k,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=3*k;
    ctx.beginPath();ctx.ellipse(cx,cy,104*k,50*k,0,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.32)';
    [[-40,-10,17,5],[32,-8,14,4],[-8,14,19,5],[56,12,10,3],[-58,10,9,3]].forEach(([dx,dy,rx,ry])=>{
      ctx.beginPath();ctx.ellipse(cx+dx*k,cy+dy*k,rx*k,ry*k,0,0,Math.PI*2);ctx.fill();
    });
  }
  if(b.dua){
    ctx.lineCap='round';
    [[[292,206],[492,84]],[[312,216],[508,98]]].forEach(([p1,p2],i)=>{
      const [x1,y1]=P(p1[0],p1[1]),[x2,y2]=P(p2[0],p2[1]);
      ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=9*k;
      ctx.beginPath();ctx.moveTo(x1+3*k,y1+5*k);ctx.lineTo(x2+3*k,y2+5*k);ctx.stroke();
      ctx.strokeStyle='#a56a36';ctx.lineWidth=8*k;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      ctx.strokeStyle='#5d3a1a';ctx.lineWidth=8*k;
      ctx.beginPath();ctx.moveTo(x2-(x2-x1)*0.12,y2-(y2-y1)*0.12);ctx.lineTo(x2,y2);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2*k;
      ctx.beginPath();ctx.moveTo(x1+(x2-x1)*0.1,y1+(y2-y1)*0.1-2*k);ctx.lineTo(x2-(x2-x1)*0.2,y2-(y2-y1)*0.2-2*k);ctx.stroke();
    });
  }
  if(b.muong){
    const [hx,hy]=P(92,128),[sx,sy]=P(206,210);
    ctx.lineCap='round';
    ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=9*k;
    ctx.beginPath();ctx.moveTo(hx+3*k,hy+5*k);ctx.lineTo(sx+3*k,sy+5*k);ctx.stroke();
    ctx.strokeStyle='#9aa7b0';ctx.lineWidth=9*k;
    ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(sx,sy);ctx.stroke();
    ctx.strokeStyle='#eef2f5';ctx.lineWidth=6*k;
    ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(sx,sy);ctx.stroke();
    ctx.fillStyle='#eef2f5';ctx.strokeStyle='#9aa7b0';ctx.lineWidth=3*k;
    ctx.beginPath();ctx.ellipse(sx+6*k,sy+3*k,32*k,19*k,-0.42,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.7)';
    ctx.beginPath();ctx.ellipse(sx+1*k,sy-1*k,15*k,7*k,-0.42,0,Math.PI*2);ctx.fill();
  }
}

function drawStallCanvas(){
  const c=document.getElementById('stallCanvas');
  if(!c)return;
  const W=900,H=820;
  c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,W,H);

  // Chọn ảnh: có hàng → full, chưa nhập → empty
  const hasStock = stockOkForAny() || ITEMS.some(i=>(S.stock[i.id]||0)>0);
  const img = hasStock ? _stallBgImg : _stallEmptyImg;
  if(img && img.complete && img.naturalWidth){
    ctx.drawImage(img, 0, 0, W, H);
  }else{
    ctx.fillStyle='#f5e6d3';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#6b3a4e';ctx.font='20px sans-serif';
    ctx.fillText('Đang tải quầy…', 20, 40);
    loadStallBg(()=>paintStall(false));
  }

  // Badge số lượng — ghim đúng vào góc từng khay/nồi/hộp trong ảnh
  Object.keys(BADGES).forEach(id=>{
    const locked=id.startsWith('nd_')&&!isBrothUnlocked(id);
    const q=stockQ(id);
    if(q<=0&&!locked)return;
    const [fx,fy]=BADGES[id];
    const cx=fx*W, cy=fy*H;
    if(locked){
      ctx.save();
      ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;
      ctx.font='bold 42px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🔒',cx,cy+8);
      ctx.restore();
      ctx.textAlign='left';ctx.textBaseline='alphabetic';
      return;
    }
    const txt=String(q), bw=Math.max(30,14+txt.length*11), bh=24;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=4;ctx.shadowOffsetY=1;
    ctx.fillStyle=TH.acc;rr(ctx,cx-bw/2,cy-bh/2,bw,bh,bh/2);ctx.fill();
    ctx.restore();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;rr(ctx,cx-bw/2,cy-bh/2,bw,bh,bh/2);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 15px "Baloo 2",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(txt,cx,cy+1);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
  });
  // Lớp khóa lớn phủ lên nồi nước dùng chưa mở
  ['nd_thuong','nd_bo','nd_ga','nd_dac'].forEach(id=>{
    if(isBrothUnlocked(id))return;
    const r=REGIONS[id];if(!r)return;
    const [x,y,w,h]=r;
    const cx=(x+w/2)*W, cy=(y+h/2)*H;
    ctx.fillStyle='rgba(40,20,30,.45)';
    rr(ctx,x*W+4,y*H+4,w*W-8,h*H-8,12);ctx.fill();
    ctx.font='bold 56px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🔒',cx,cy-6);
    ctx.fillStyle='#fff';ctx.font='bold 13px "Nunito",sans-serif';
    const dayNeed=BROTH_UNLOCK[id]||1;
    ctx.fillText((currentLang==='en'?'Day ':'Ngày ')+dayNeed,cx,cy+28);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
  });

  // Tô đang làm trên KHU VỰC GIAO MÓN — dùng ảnh bát Assets/bowl.png
  if(L&&L.bowl&&L.bowl.bat){
    const [x,y,w,h]=REGIONS.board;
    const cx=x*W+w*W*0.5, cy=y*H+h*H*0.50;
    const bw=w*W*0.98, bh=bw*(478/522);
    if(_bowlImg&&_bowlImg.complete&&_bowlImg.naturalWidth){
      ctx.drawImage(_bowlImg, cx-bw/2, cy-bh*0.45, bw, bh);
    }else{
      drawPhoBowl(ctx, cx, cy, 1.4, L.bowl);
    }
    // lớp nguyên liệu đè lên ảnh bát
    drawBowlLayersOnAsset(ctx, cx-bw/2, cy-bh*0.45, bw/522, L.bowl);
    ctx.strokeStyle='rgba(255,111,159,0.85)';ctx.lineWidth=4;
    rr(ctx, x*W+6, y*H+6, w*W-12, h*H-12, 12);ctx.stroke();
    ctx.fillStyle='#6b3a4e';ctx.font='bold 12px "Nunito",sans-serif';ctx.textAlign='center';
    ctx.fillText(currentLang==='en'?'Tap board to serve':'Chạm khay để giao', cx, y*H+h*H-12);
    ctx.textAlign='left';
  }

}

function hashStr(str){let h=0;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))|0;return Math.abs(h)}
function wrapLines(ctx,text,maxW){
  const words=String(text).split(' ');const lines=[];let line='';
  words.forEach(w=>{
    const tt=line?line+' '+w:w;
    if(ctx.measureText(tt).width>maxW&&line){lines.push(line);line=w}else line=tt;
  });
  if(line)lines.push(line);return lines;
}
function strokeFill(ctx,txt,x,y,fill,stroke,lw){
  ctx.lineJoin='round';ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.strokeText(txt,x,y);

}

/** Bán thân khách hàng — biểu cảm đổi theo độ kiên nhẫn */
function drawCustBust(ctx,cx,cy,sc,face,pat,seed){
  const hs=seed%3;
  const mood=pat>60?0:(pat>30?1:2);
  ctx.save();
  // tóc phía sau
  ctx.fillStyle=face.hair;
  if(hs===1){ // tóc dài
    rr(ctx,cx-17*sc,cy-8*sc,34*sc,34*sc,9*sc);ctx.fill();
  }
  if(hs===2){ // búi tóc
    ctx.beginPath();ctx.arc(cx,cy-19*sc,6*sc,0,Math.PI*2);ctx.fill();
  }
  ctx.beginPath();ctx.arc(cx,cy-2*sc,16*sc,Math.PI,0);ctx.fill();
  // thân áo
  ctx.fillStyle=face.shirt;
  rr(ctx,cx-16*sc,cy+15*sc,32*sc,27*sc,11*sc);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=1.5*sc;
  ctx.beginPath();ctx.moveTo(cx,cy+22*sc);ctx.lineTo(cx,cy+40*sc);ctx.stroke();
  // cổ
  ctx.fillStyle=face.skin;
  ctx.fillRect(cx-4.5*sc,cy+11*sc,9*sc,7*sc);
  ctx.beginPath();ctx.moveTo(cx-6*sc,cy+16*sc);ctx.lineTo(cx,cy+23*sc);ctx.lineTo(cx+6*sc,cy+16*sc);ctx.closePath();ctx.fill();
  // đầu
  ctx.beginPath();ctx.arc(cx,cy,14*sc,0,Math.PI*2);ctx.fill();
  // tóc mái
  ctx.fillStyle=face.hair;
  ctx.beginPath();ctx.arc(cx-7*sc,cy-8*sc,9*sc,Math.PI,0);ctx.fill();
  ctx.beginPath();ctx.arc(cx+7*sc,cy-8*sc,9*sc,Math.PI,0);ctx.fill();
  // má hồng
  ctx.fillStyle=mood===2?'rgba(240,80,110,.55)':'rgba(255,130,150,.35)';
  ctx.beginPath();ctx.ellipse(cx-8.5*sc,cy+4*sc,3.2*sc,2*sc,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+8.5*sc,cy+4*sc,3.2*sc,2*sc,0,0,Math.PI*2);ctx.fill();
  // mắt
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath();ctx.ellipse(cx-5*sc,cy-0.5*sc,1.9*sc,2.4*sc,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+5*sc,cy-0.5*sc,1.9*sc,2.4*sc,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(cx-4.4*sc,cy-1.3*sc,0.7*sc,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+5.6*sc,cy-1.3*sc,0.7*sc,0,Math.PI*2);ctx.fill();
  // lông mày + miệng
  ctx.strokeStyle=face.hair;ctx.lineWidth=1.3*sc;ctx.lineCap='round';
  ctx.beginPath();
  if(mood===2){
    ctx.moveTo(cx-8*sc,cy-5.5*sc);ctx.lineTo(cx-2.5*sc,cy-3.5*sc);
    ctx.moveTo(cx+8*sc,cy-5.5*sc);ctx.lineTo(cx+2.5*sc,cy-3.5*sc);
  }else{
    ctx.moveTo(cx-8*sc,cy-4.5*sc);ctx.lineTo(cx-2.5*sc,cy-4.8*sc);
    ctx.moveTo(cx+8*sc,cy-4.5*sc);ctx.lineTo(cx+2.5*sc,cy-4.8*sc);
  }
  ctx.stroke();
  ctx.strokeStyle='#d9506a';ctx.lineWidth=1.6*sc;
  ctx.beginPath();
  if(mood===0)ctx.arc(cx,cy+4*sc,5*sc,0.2,Math.PI-0.2);
  else if(mood===1){ctx.moveTo(cx-3.5*sc,cy+7.5*sc);ctx.lineTo(cx+3.5*sc,cy+7.5*sc)}
  else ctx.arc(cx,cy+10*sc,4.5*sc,Math.PI+0.3,-0.3);
  ctx.stroke();
  // giọt mồ hôi khi sắp hết kiên nhẫn
  if(mood===2){
    ctx.fillStyle='#7fd0ff';
    ctx.beginPath();ctx.moveTo(cx+16*sc,cy-8*sc);
    ctx.quadraticCurveTo(cx+20*sc,cy-2*sc,cx+16*sc,cy+0.5*sc);
    ctx.quadraticCurveTo(cx+12*sc,cy-2*sc,cx+16*sc,cy-8*sc);ctx.fill();
  }
  ctx.restore();
}

  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#b9824c';ctx.fillRect(0,0,W,10);
  ctx.fillStyle='#d6a06a';ctx.fillRect(0,10,W,6);
  // nền lát đường
  ctx.fillStyle='rgba(160,110,70,.14)';ctx.fillRect(0,478,W,H-478);
  ctx.strokeStyle='rgba(160,110,70,.22)';ctx.lineWidth=2;
  for(let x=-40;x<W;x+=90){ctx.beginPath();ctx.moveTo(x,478);ctx.lineTo(x+30,H);ctx.stroke()}
  // vách ngăn khu nhân viên
  ctx.setLineDash([10,10]);ctx.strokeStyle='rgba(160,96,58,.45)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(640,250);ctx.lineTo(640,H-16);ctx.stroke();ctx.setLineDash([]);

  const custs=(L&&L.custs)||[];
  const cur=L&&L.cur;
  const curIdx=cur?custs.indexOf(cur):-1;
  const slotCx=i=>CUST_SLOT_X0+CUST_SLOT_W*i+CUST_SLOT_W/2;

  // ---- Bong bóng gọi món (chữ lớn, rõ) ----
  const bx=16,by=24,bw=W-32,bh=196;
  const tailX=curIdx>=0&&curIdx<CUST_SLOTS?slotCx(curIdx):null;
  ctx.fillStyle='#fff';ctx.strokeStyle=TH.acc2;ctx.lineWidth=5;
  if(tailX!==null){
    ctx.beginPath();ctx.moveTo(tailX-28,by+bh-2);ctx.lineTo(tailX,by+bh+40);ctx.lineTo(tailX+28,by+bh-2);ctx.closePath();
    ctx.fill();ctx.stroke();
  }
  rr(ctx,bx,by,bw,bh,26);ctx.fill();ctx.stroke();
  if(tailX!==null){ctx.fillStyle='#fff';ctx.fillRect(tailX-25,by+bh-6,50,9)}
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  if(cur){
    ctx.fillStyle='#ff4f8b';ctx.font=`bold 30px ${CUST_FONT}`;
    ctx.fillText(`${cur.n} ${vi?'gọi món:':'orders:'}`,bx+30,by+44);
    const desc=cur.order.desc||orderDesc(cur.order);
    let f=44,lines;
    for(const fs of [44,40,36,32]){
      f=fs;ctx.font=`bold ${f}px ${CUST_FONT}`;
      lines=wrapLines(ctx,desc,bw-60);
      if(lines.length<=2)break;
    }
    ctx.fillStyle='#4a2030';
    const lh=f*1.18;
    lines.slice(0,3).forEach((ln,i)=>ctx.fillText(ln,bx+30,by+58+f*0.9+i*lh));
    // thanh kiên nhẫn
    const px=bx+30,pw=bw-60,py=by+bh-30,pv=Math.max(0,Math.min(100,cur.pat));
    ctx.fillStyle='rgba(0,0,0,.10)';rr(ctx,px,py,pw,16,8);ctx.fill();
    if(pv>0){ctx.fillStyle=patColor(pv);rr(ctx,px,py,Math.max(16,pw*pv/100),16,8);ctx.fill()}
  }else{
    ctx.fillStyle='#8a5a6e';ctx.font=`bold 40px ${CUST_FONT}`;ctx.textAlign='center';
    const msg=L?t('waiting'):(vi?'Nhập hàng đủ rồi bấm "Mở cửa quán"':'Stock up, then tap "Open for business"');
    const ls=wrapLines(ctx,msg,bw-60);
    ls.slice(0,2).forEach((ln,i)=>ctx.fillText(ln,W/2,by+bh/2-6+i*50-(ls.length>1?20:-14)));
    ctx.textAlign='left';
  }

  // ---- Khách hàng ----
  const cap=1+Math.min(2,S.up.deco);
  ctx.textAlign='center';
  for(let i=0;i<CUST_SLOTS;i++){
    const cx=slotCx(i),c2=custs[i];
    if(!c2){
      if(L&&i<cap){
        ctx.setLineDash([8,8]);ctx.strokeStyle='rgba(160,96,58,.35)';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(cx,CUST_HEAD_Y+20,50,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
      }
      continue;
    }
    const sel=c2===cur;
    if(sel){
      ctx.fillStyle='rgba(255,255,255,.55)';ctx.strokeStyle=TH.acc;ctx.lineWidth=5;
      rr(ctx,cx-94,246,188,300,22);ctx.fill();ctx.stroke();
    }
    drawCustBust(ctx,cx,CUST_HEAD_Y,3.2,c2.face||FACE_STYLES[0],c2.pat,hashStr(c2.n));
    ctx.font=`bold 32px ${CUST_FONT}`;
    strokeFill(ctx,c2.n+(c2.tag||''),cx,CUST_NAME_Y,sel?'#d81b60':'#5a2d41','#fff',8);
    const pv=Math.max(0,Math.min(100,c2.pat));
    ctx.fillStyle='rgba(0,0,0,.14)';rr(ctx,cx-70,CUST_NAME_Y+14,140,14,7);ctx.fill();
    if(pv>0){ctx.fillStyle=patColor(pv);rr(ctx,cx-70,CUST_NAME_Y+14,Math.max(14,140*pv/100),14,7);ctx.fill()}
  }

  // ---- Nhân viên quán ----
  ctx.font=`bold 26px ${CUST_FONT}`;
  strokeFill(ctx,vi?'NHÂN VIÊN':'STAFF',762,268,'#a0603a','#fff',7);
  const hired=STAFF.filter(st=>S.staff[st.id]);
  if(!hired.length){
    ctx.setLineDash([8,8]);ctx.strokeStyle='rgba(160,96,58,.4)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(762,STAFF_HEAD_Y+10,46,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    ctx.font=`bold 28px ${CUST_FONT}`;
    strokeFill(ctx,vi?'Chưa thuê':'No staff',768,458,'#7a4a5e','#fff',7);
    strokeFill(ctx,vi?'nhân viên':'hired',768,490,'#7a4a5e','#fff',7);
    ctx.font=`bold 22px ${CUST_FONT}`;
    strokeFill(ctx,vi?'Thuê ở ⚒️ Nâng cấp':'Hire in ⚒️ Upgrades',768,526,'#8a5a6e','#fff',6);
  }else{
    const xs=hired.length===1?[762]:[705,820];
    hired.forEach((st,i)=>{
      const cx=xs[i];
      drawStaffBust(ctx,cx,STAFF_HEAD_Y,2.6,st.id);
      ctx.font=`bold 30px ${CUST_FONT}`;
      strokeFill(ctx,st.name,cx,CUST_NAME_Y,'#3f7d4e','#fff',8);
      ctx.font=`bold 22px ${CUST_FONT}`;
      strokeFill(ctx,staffN(st),cx,CUST_NAME_Y+30,'#7a4a5e','#fff',6);
    });
  }
  ctx.textAlign='left';
}

/** Vùng chạm chọn khách (chạm vào khách để phục vụ người đó) */
function buildCustHits(){
  const box=document.getElementById('custHits');
  if(!box)return;
  const custs=(L&&L.custs)||[];
  const sig=custs.map(c=>c.id).join(',')+'|'+(L&&L.cur?L.cur.id:'');
  if(box.dataset.sig===sig)return;
  box.dataset.sig=sig;
  box.innerHTML='';
  custs.slice(0,CUST_SLOTS).forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='cust-hit';
    el.style.left=((CUST_SLOT_X0+i*CUST_SLOT_W)/CUST_W*100)+'%';
    el.style.top=(236/CUST_H*100)+'%';
    el.style.width=(CUST_SLOT_W/CUST_W*100)+'%';
    el.style.height=(310/CUST_H*100)+'%';
    el.onclick=(ev)=>{ev.preventDefault();pickCust(c)};
    box.appendChild(el);
  });
}
function pickCust(c){
  if(!L||L.cur===c||!L.custs.includes(c))return;
  L.cur=c;L.bowl=emptyBowl();sfx('click');softOrRender();
}

function buildStallHits(){
  const box=document.getElementById('stallHits');
  if(!box)return;
  box.innerHTML='';
  const keys=['bat','nd_thuong','nd_bo','nd_ga','nd_dac','tom','hanh','quay','hat_nem','duong','bot_ngot','pho','nuoc_mam','muong','dua','serve','board'];
  keys.forEach(id=>{
    const r=REGIONS[id];if(!r)return;
    const [x,y,w,h]=r;
    const q=id==='serve'?1:(S.stock[id]||0);
    const el=document.createElement('div');
    el.dataset.id=id;
    el.className='stall-hit'+(q<=0&&id!=='serve'?' empty':'')+(L&&L.bowl&&((id.startsWith('nd_')&&L.bowl.broth===id)||L.bowl[id])?' on':'');
    el.style.left=(x*100)+'%';el.style.top=(y*100)+'%';
    el.style.width=(w*100)+'%';el.style.height=(h*100)+'%';
    el.onclick=(ev)=>{
      ev.preventDefault();
      if(id==='serve'||id==='board'){serveBowl();return}
      if(id.startsWith('nd_')&&!isBrothUnlocked(id)){
        toast((currentLang==='en'?'🔒 Unlocks day ':'🔒 Mở ngày ')+(BROTH_UNLOCK[id]||1));sfx('bad');return;
      }
      if((S.stock[id]||0)<=0){toast(t('out'));sfx('bad');return}
      addToBowl(id);
    };
    box.appendChild(el);
  });
}
function updateStallBadges(){
  const box=document.getElementById('stallHits');
  if(!box)return;
  [...box.children].forEach(el=>{
    const id=el.dataset.id;if(!id||id==='serve')return;
    const q=S.stock[id]||0;
    el.classList.toggle('empty',q<=0);
    el.classList.toggle('on',!!(L&&L.bowl&&((id.startsWith('nd_')&&L.bowl.broth===id)||L.bowl[id])));
  });
}
let _stallPaintQueued=false;
function paintStall(forceHits){
  if(_stallPaintQueued)return;
  _stallPaintQueued=true;
  const run=()=>{
    _stallPaintQueued=false;
    if(!document.getElementById('stallCanvas'))return;
    drawStallCanvas();
    drawCustCanvas();
    buildCustHits();
    if(forceHits!==false)buildStallHits();
    else updateStallBadges();
  };
  loadStallBg(()=>requestAnimationFrame(run));
}
function updateLiveUI(){
  const hd=document.getElementById('hd');
  if(hd)hd.innerHTML=headHtml();
  if(!L||S.tab!=='shop')return;
  const bar=document.getElementById('custBar');
  if(bar){
    let h='';
    if(L.custs.length){
      h+=`<div class="row" style="flex-wrap:wrap;gap:6px">`+
        L.custs.map(c=>`<button style="padding:4px 10px;${L.cur===c?'background:var(--acc);color:#fff':''}" onclick="selectCust(${c.id})">${c.n}</button>`).join('')+
        `</div>`;
    }else h+=`<div style="text-align:center"><small>${t('waiting')}</small></div>`;
    bar.innerHTML=h;
  }
  const log=document.getElementById('liveLog');
  if(log)log.innerHTML=L.log.slice(-6).reverse().join('<br>');
  paintStall(false);
}

/* ===== LIVE DAY ===== */
function stockMissing(){
  const miss=[];
  if((S.stock.bat||0)<1)miss.push(itemN(findItem('bat')));
  if((S.stock.dua||0)<1)miss.push(itemN(findItem('dua')));
  if((S.stock.pho||0)<1)miss.push(itemN(findItem('pho')));
  let broth=0;
  ['nd_bo','nd_ga','nd_dac','nd_thuong'].forEach(id=>{if(isBrothUnlocked(id))broth+=(S.stock[id]||0)});
  if(broth<1)miss.push(currentLang==='en'?'Broth':'Nước dùng');
  return miss;
}
function stockOkForAny(){return stockMissing().length===0}
function stockHasAnyFood(){
  return ITEMS.some(i=>i.kind!=='ut'&&(S.stock[i.id]||0)>0);
}
function showEventModal(){
  const e=currentEvent();
  if(!e||e.id==='none')return;
  $('#modal').innerHTML=`<div class="mb"><div style="font-size:48px;margin-bottom:6px">🎉</div>
    <h3 style="margin:0 0 8px">${evtN(e)}</h3>
    <p style="margin:0 0 12px">${evtD(e)}</p>
    <button class="o main" onclick="$('#modal').style.display='none'">OK</button></div>`;
  $('#modal').style.display='flex';sfx('pop');
}
function openShop(){
  if(!stockOkForAny()){const m=stockMissing();toast(t('emptyStock')+(m.length?': '+m.join(', '):''));sfx('bad');return}
  {const ar=curArea();if(!payRent(ar)){S.area='truoc';S.rentPaid={day:S.day,area:'truoc'};toast('💸 Không đủ tiền thuê, về bán trước quán')}else if(ar.rent&&!(L&&0))toast('Đã thuê '+ar.n+' −'+fmt(ar.rent)+'₫')}
  if(!S.eventId)S.eventId=pickDayEvent().id;
  S.phase='open';
  const e=currentEvent();
  L={t:0,custs:[],cur:null,bowl:emptyBowl(),served:0,turned:0,rev:0,scores:[],log:[`🔔 ${S.name} mở cửa!`+(e&&e.id!=='none'?' · '+evtN(e):'')],runners:0,lost:0,clock:'10:00'};
  paused=false;sfx('bell');save();render();
  timer=setInterval(tick,TICK_MS);
}
function tick(){
  if(!L||paused)return;
  L.t++;
  const span=12*60; // 10:00-22:00 display
  const gMin=10*60+Math.floor((Math.min(L.t,getTicks())/getTicks())*span);
  L.clock=`${String(Math.floor(gMin/60)%24).padStart(2,'0')}:${String(gMin%60).padStart(2,'0')}`;
  // patience
  const ev=currentEvent();
  const patDrain=(1.1-S.up.speed*0.15-(S.staff.phucvu?0.2:0))*(1-(ev.patBonus||0));
  [...L.custs].forEach(c=>{
    c.pat-=patDrain*CTYPES[c.type||'thuong'].drain;
    if(c.pat<=0){
      L.turned++;L.scores.push(1);pushFb(c,1);
      L.log.push(`😡 ${c.n} hết kiên nhẫn`);
      L.custs=L.custs.filter(x=>x!==c);
      if(L.cur===c){L.cur=null;L.bowl=emptyBowl()}
      sfx('bad');
    }
  });
  // auto serve by staff
  if(S.staff.phucvu&&L.cur&&Math.random()<.25){
    const c=L.cur;
    // try build correct bowl quickly if stock allows
    if(canAutoBuild(c)){autoBuild(c);serveBowl(true)}
  }
  // spawn
  if(L.t<getTicks()&&L.custs.length<(1+Math.min(2,S.up.deco)+(ev.spawn>1.2?1:0)+(areaMul()>1.4?1:0))){
    const p=(0.04+Math.pow(S.rating/5,2)*0.2+S.up.deco*0.015)*ratingMul()*Math.min(1.25,Math.max(1,avgKeep()))*(ev.spawn||1)*areaMul();
    if(Math.random()<p){
      const g=makeCust();
      if(Math.random()>Math.min(1,priceKeep(g.order.menuId))){L.log.push(`😒 ${g.n} chê giá đắt, đi qua`);}else{
      L.custs.push(g);
      if(!L.cur)L.cur=g;
      L.log.push(`${g.n}${g.tag||''} · ${g.order.desc||g.order.label}`);
      sfx('pop');}
    }
  }
  maybeInspect();
  if(S.day>=1&&L.t>15&&L.t%28===0&&unreadMsg()<4&&Math.random()<.45)addMsg();
  if(L.t>=getTicks()||(!stockOkForAny()&&!L.custs.length)){
    clearInterval(timer);endDay();return;
  }
  if(S.tab==='shop'&&document.getElementById('stallCanvas'))updateLiveUI();else if(S.tab==='shop')render();else headOnly();
}
function avgPrice(){return MENU.reduce((a,m)=>a+(S.sell[m.id]||m.priceDef),0)/MENU.length}
function canAutoBuild(c){
  const o=c.order;
  if((S.stock.bat||0)<1||(S.stock.pho||0)<1||(S.stock.dua||0)<1||(S.stock[o.broth]||0)<1)return false;
  for(const id of o.need)if(id!=='pho'&&(S.stock[id]||0)<1)return false;
  for(const id of o.extras)if((S.stock[id]||0)<1)return false;
  return true;
}
function autoBuild(c){
  const o=c.order;L.bowl=emptyBowl();
  L.bowl.bat=true;L.bowl.pho=true;L.bowl.broth=o.broth;L.bowl.dua=true;
  o.need.forEach(id=>{if(id!=='pho')L.bowl[id]=true});
  o.extras.forEach(id=>L.bowl[id]=true);
}
function selectCust(id){
  if(!L)return;
  const c=L.custs.find(x=>x.id===id);if(!c)return;
  L.cur=c;L.bowl=emptyBowl();sfx('click');render();
}
function addToBowl(key){
  if(!L||!L.cur){toast(t('noCust'));return}
  const b=L.bowl;
  if(key==='bat'){
    if(b.bat){toast(t('putBowl'));return}
    if((S.stock.bat||0)<1){toast(t('out')+' 🥣');sfx('bad');return}
    b.bat=true;sfx('click');toast(t('putBowl'));softOrRender();return;
  }
  if(!b.bat){toast(t('needBowl'));sfx('bad');return}
  if(key.startsWith('nd_')){
    if(!isBrothUnlocked(key)){
      const d=BROTH_UNLOCK[key]||1;
      toast((currentLang==='en'?'🔒 Unlocks day ':'🔒 Mở ngày ')+d);sfx('bad');return;
    }
    if(b.broth){b.broth=null;sfx('click');softOrRender();return}
    if((S.stock[key]||0)<1){toast(t('out'));sfx('bad');return}
    b.broth=key;sfx('click');toast(t('addLayer')+' 🍲');softOrRender();return;
  }
  if(['pho','tom','hanh','quay','hat_nem','duong','bot_ngot','nuoc_mam','dua','muong'].includes(key)){
    if(b[key]){b[key]=false;sfx('click');softOrRender();return}
    if((S.stock[key]||0)<1){toast(t('out'));sfx('bad');return}
    b[key]=true;sfx('click');toast(t('addLayer')+' '+(findItem(key)?.e||''));softOrRender();return;
  }
}
function softOrRender(){
  if(document.getElementById('stallCanvas')&&S.phase==='open'){updateLiveUI();paintStall(true)}
  else render();
}
function clearBowl(){if(L){L.bowl=emptyBowl();sfx('click');softOrRender()}}
function consumeBowl(b){
  if(b.bat)S.stock.bat=Math.max(0,(S.stock.bat||0)-1);
  if(b.pho)S.stock.pho=Math.max(0,(S.stock.pho||0)-1);
  if(b.tom)S.stock.tom=Math.max(0,(S.stock.tom||0)-1);
  if(b.hanh)S.stock.hanh=Math.max(0,(S.stock.hanh||0)-1);
  if(b.quay)S.stock.quay=Math.max(0,(S.stock.quay||0)-1);
  if(b.hat_nem)S.stock.hat_nem=Math.max(0,(S.stock.hat_nem||0)-1);
  if(b.duong)S.stock.duong=Math.max(0,(S.stock.duong||0)-1);
  if(b.bot_ngot)S.stock.bot_ngot=Math.max(0,(S.stock.bot_ngot||0)-1);
  if(b.nuoc_mam)S.stock.nuoc_mam=Math.max(0,(S.stock.nuoc_mam||0)-1);
  if(b.broth)S.stock[b.broth]=Math.max(0,(S.stock[b.broth]||0)-1);
  if(b.dua)S.stock.dua=Math.max(0,(S.stock.dua||0)-1);
  if(b.muong)S.stock.muong=Math.max(0,(S.stock.muong||0)-1);
}
function serveBowl(auto){
  if(!L||!L.cur)return;
  const c=L.cur,b=L.bowl;
  if(!b.bat){toast(t('needBowl'));sfx('bad');return}
  if(!b.pho){toast(t('needPho'));sfx('bad');return}
  if(!b.broth){toast(t('needBroth'));sfx('bad');return}
  if(!b.dua){toast('🥢!');sfx('bad');return}
  const ok=matchOrder(b,c.order);
  if(!ok){
    c.pat-=(c.type==='kho'?50:35);sfx('bad');
    if(c.pat<=0||Math.random()<(c.type==='nong'?.8:.45)){
      L.turned++;L.scores.push(1);pushFb(c,1);L.log.push(`😤 ${c.n} ${t('wrong')}`);
      L.custs=L.custs.filter(x=>x!==c);L.cur=L.custs[0]||null;L.bowl=emptyBowl();
      toast(t('wrong'));save();render();return;
    }
    toast(t('wrong')+' −35%');L.bowl=emptyBowl();save();render();return;
  }
  consumeBowl(b);
  const basePrice=S.sell[c.order.menuId]||MENU.find(m=>m.id===c.order.menuId).priceDef;
  const tipMul=currentEvent().tip||1;
  const price=Math.floor(basePrice*tipMul*curArea().tip);
  if(c.run){
    if(Math.random()<0.35+S.up.sec*0.15){L.log.push(`💂 Chặn được ${c.n}`)}
    else{
      L.runners++;L.lost+=price;L.scores.push(1);(S.thieves=S.thieves||[]).unshift({id:Date.now()+Math.random(),n:c.n,face:c.face,type:c.type,day:S.day,amt:price,area:curArea().n,st:'open'});S.thieves=S.thieves.slice(0,30);
      L.log.push(`🏃 ${c.n} ${t('ranAway')} ${fmt(price)}`);
      L.custs=L.custs.filter(x=>x!==c);L.cur=L.custs[0]||null;L.bowl=emptyBowl();
      sfx('bad');toast(`🏃 ${c.n}`);save();render();return;
    }
  }
  S.money+=price;L.rev+=price;L.served++;{const r=R();r.rev+=price;r.revBy[c.order.menuId]=(r.revBy[c.order.menuId]||0)+price;r.cogs+=bowlCost(b)}
  let sc=3.5+(c.pat/100)*1.3+S.up.deco*0.15+Math.random()*0.4-0.2+(currentEvent().scoreBonus||0);
  if(c.type==='kho')sc-=(c.pat>75?0.3:1);if(c.type==='nong'&&c.pat<50)sc-=1;if(c.type==='de')sc+=.5;
  sc=clamp(Math.round(sc),1,5);L.scores.push(sc);
  pushFb(c,sc);
  L.log.push(`💰 ${c.n} · ${fmt(price)} ${stars(sc)}`);
  L.custs=L.custs.filter(x=>x!==c);L.cur=L.custs[0]||null;L.bowl=emptyBowl();
  sfx('bell');sfx('coin');toast(t('okServe')+' +'+fmt(price));save();render();
}
function endDay(){
  const sc=L.scores,avg=sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:0;
  if(sc.length)S.rating=clamp(S.rating*.7+avg*.3,1,5);
  let keep=.5+.15*S.up.fr+(S.staff.bep?0.1:0);keep=Math.min(0.95,keep);
  ITEMS.forEach(i=>{if(i.kind!=='ut')S.stock[i.id]=Math.floor((S.stock[i.id]||0)*keep)});

const REF_ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const REF_REWARD=150000;
function normRef(x){return String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function refChk(body){let h=7;for(const ch of body)h=(h*31+REF_ALPHA.indexOf(ch)+1)%997;return REF_ALPHA[h%32]}
function validRef(code){
  const n=normRef(code);
  if(!/^PHO[A-Z0-9]{6}$/.test(n))return false;
  const body=n.slice(3,8);
  return [...body].every(ch=>REF_ALPHA.includes(ch))&&refChk(body)===n[8];
}
function fmtRef(n){n=normRef(n);return 'PHO-'+n.slice(3)}
function getRefCode(){
  let c=null;
  try{c=localStorage.getItem('pho_ref_code')}catch(e){}
  if(!validRef(c)){
    let body='';for(let i=0;i<5;i++)body+=REF_ALPHA[Math.floor(Math.random()*32)];
    c=fmtRef('PHO'+body+refChk(body));
    try{localStorage.setItem('pho_ref_code',c)}catch(e){}
  }
  return c;
}
function getRefUsed(){try{return localStorage.getItem('pho_ref_used')||''}catch(e){return ''}}

      <small style="display:block;margin-top:6px">${vi?'Gửi mã này cho bạn bè. Người nhập mã lần đầu nhận '+REF_REWARD.toLocaleString('vi-VN')+'₫.':'Share this code with friends. Someone who enters it for the first time gets '+REF_REWARD.toLocaleString('en-US')+'₫.'}</small></div>

  $('#modal').style.display='flex';
}

  const it=findItem(id);if(!it)return;

    S.money-=cost;R().buy+=cost;S.spent=(S.spent||0)+cost;S.stock[id]=(S.stock[id]||0)+qty;sfx('coin');

  const tabs=[['market','🛒'],['stock','📦'],['up','⚒️'],['shop','🏠'],['msg','💬'],['fb','⭐'],['book','📒']];
  const ur=unreadMsg();
  return tabs.map(([id,e])=>{
    const badge=(id==='msg'&&ur)?`<span class="bd">${ur}</span>`:'';
    return `<button class="${id==='shop'?'home ':''}${S.tab===id?'on':''}" onclick="S.tab='${id}';sfx('click');render()"><span>${e}</span>${badge}</button>`;
  }).join('');
}

/* ===== SIÊU THỊ — chợ vẽ bằng canvas, hàng lên kệ theo gian ===== */
const MK_W=900, MK_BANNER_H=170, MK_AISLE_H=460;
const MK_AISLES=[
  {vi:'GIAN DỤNG CỤ',en:'TOOLS AISLE',col:'#3f8fd2',items:['bat','dua','muong']},
  {vi:'GIAN BÁNH PHỞ & TOPPING',en:'NOODLES & TOPPINGS',col:'#f07f2d',items:['pho','tom','hanh','quay']},
  {vi:'GIAN NƯỚC DÙNG',en:'BROTH AISLE',col:'#b8492f',items:['nd_thuong','nd_bo','nd_ga','nd_dac']},
  {vi:'GIAN GIA VỊ',en:'SEASONING AISLE',col:'#3f9b56',items:['hat_nem','duong','bot_ngot','nuoc_mam']}
];
const MK_H=MK_BANNER_H+MK_AISLES.length*MK_AISLE_H+20;
function mkLayout(){
  const slots=[];
  MK_AISLES.forEach((a,ai)=>{
    const ay=MK_BANNER_H+ai*MK_AISLE_H,uy=ay+96,n=a.items.length,sw=203,x0=44+(4-n)*sw/2;
    a.items.forEach((id,i)=>slots.push({id,ai,ay,uy,cx:x0+i*sw+sw/2}));
  });
  return slots;
}
function paintMarket(){
  const c=document.getElementById('mkCanvas');
  if(!c)return;
  const W=MK_W,H=MK_H,vi=currentLang!=='en';
  c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  const F=CUST_FONT;
  // tường + sàn
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#fdeed6');g.addColorStop(1,'#f3dbb6');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // mái hiên + biển hiệu
  for(let i=0;i<10;i++){
    ctx.fillStyle=i%2?'#ffffff':'#e2525d';
    ctx.fillRect(i*90,0,90,36);
    ctx.beginPath();ctx.arc(i*90+45,36,45,0,Math.PI);ctx.fill();
  }
  ctx.fillStyle='#d9a468';rr(ctx,24,96,666,62,16);ctx.fill();
  ctx.strokeStyle='#9a6a3a';ctx.lineWidth=5;rr(ctx,24,96,666,62,16);ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`bold 38px ${F}`;
  strokeFill(ctx,vi?'SIÊU THỊ NGUYÊN LIỆU':'INGREDIENT MARKET',357,128,'#fff','#7a4a22',8);
  ctx.fillStyle=TH.acc;rr(ctx,704,96,172,62,16);ctx.fill();
  ctx.font=`bold 27px ${F}`;ctx.fillStyle='#fff';
  ctx.fillText(fmt(S.money)+'₫',790,128);
  // các gian hàng
  const slots=mkLayout();
  const money=S.money;
  MK_AISLES.forEach((a,ai)=>{
    const ay=MK_BANNER_H+ai*MK_AISLE_H,uy=ay+96;
    // sàn caro cuối gian
    for(let x=0;x<W;x+=30){
      ctx.fillStyle=((x/30)+ai)%2?'#e8cfa6':'#efdcbc';
      ctx.fillRect(x,ay+MK_AISLE_H-20,30,20);
    }
    // dây treo + biển gian
    ctx.strokeStyle='#6b5a4a';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(200,ay-2);ctx.lineTo(200,ay+10);ctx.moveTo(700,ay-2);ctx.lineTo(700,ay+10);ctx.stroke();
    ctx.fillStyle=a.col;rr(ctx,110,ay+8,680,70,18);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=4;rr(ctx,110,ay+8,680,70,18);ctx.stroke();
    ctx.font=`bold 36px ${F}`;
    strokeFill(ctx,vi?a.vi:a.en,450,ay+44,'#fff','rgba(0,0,0,.35)',7);
    // khung kệ
    ctx.fillStyle='#a9784a';rr(ctx,24,uy,852,346,20);ctx.fill();
    ctx.fillStyle='#fff8ee';rr(ctx,38,uy+14,824,318,12);ctx.fill();
    ctx.fillStyle='rgba(169,120,74,.07)';
    for(let x=52;x<850;x+=44)ctx.fillRect(x,uy+14,20,318);
    // tấm kệ (plank)
    const pg=ctx.createLinearGradient(0,uy+164,0,uy+186);
    pg.addColorStop(0,'#e0aa72');pg.addColorStop(1,'#b07a44');
    ctx.fillStyle=pg;ctx.fillRect(30,uy+164,840,22);
    ctx.fillStyle='rgba(0,0,0,.14)';ctx.fillRect(38,uy+186,824,7);
  });
  // hàng trên kệ
  slots.forEach(sl=>{
    const it=findItem(sl.id),a=MK_AISLES[sl.ai],cx=sl.cx,uy=sl.uy;
    const q=S.stock[sl.id]||0;
    // bóng dưới hàng
    ctx.fillStyle='rgba(0,0,0,.16)';
    ctx.beginPath();ctx.ellipse(cx,uy+163,54,7,0,0,Math.PI*2);ctx.fill();
    // hộp/gói hàng
    ctx.fillStyle='#ffffff';rr(ctx,cx-62,uy+24,124,134,16);ctx.fill();
    ctx.fillStyle=a.col+'1f';rr(ctx,cx-62,uy+24,124,134,16);ctx.fill();
    ctx.strokeStyle=a.col+'aa';ctx.lineWidth=3;rr(ctx,cx-62,uy+24,124,134,16);ctx.stroke();
    drawItemIcon(ctx,sl.id,cx,uy+94,3.0);
    // chip tồn kho
    ctx.font=`bold 21px ${F}`;
    const chip=(vi?'Kho ':'Stock ')+q,cw=ctx.measureText(chip).width+22;
    ctx.fillStyle=q>0?'#2fb98a':'#f0506e';rr(ctx,cx+62-cw+10,uy+12,cw,32,16);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2.5;rr(ctx,cx+62-cw+10,uy+12,cw,32,16);ctx.stroke();
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';
    ctx.fillText(chip,cx+62-cw/2+10,uy+29);
    // thẻ giá
    ctx.fillStyle='#fff';rr(ctx,cx-94,uy+196,188,84,14);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.14)';ctx.lineWidth=2;rr(ctx,cx-94,uy+196,188,84,14);ctx.stroke();
    const unit=itemBuyPrice(it);
    const nm=itemN(it),price=unit.toLocaleString(vi?'vi-VN':'en-US')+'₫';
    ctx.fillStyle='#4a2030';
    ctx.font=`bold 26px ${F}`;
    if(ctx.measureText(nm).width<=172){
      ctx.fillText(nm,cx,uy+196+26);
      ctx.font=`bold 28px ${F}`;ctx.fillStyle=a.col;ctx.fillText(price,cx,uy+196+60);
    }else{
      ctx.font=`bold 22px ${F}`;
      const ls=wrapLines(ctx,nm,172).slice(0,2);
      ls.forEach((ln,i)=>ctx.fillText(ln,cx,uy+196+19+i*24));
      ctx.font=`bold 26px ${F}`;ctx.fillStyle=a.col;ctx.fillText(price,cx,uy+196+68);
    }
    // nút Mua — nhập số lượng
    const can=money>=unit;
    ctx.fillStyle=can?TH.acc:'#cdbfc4';rr(ctx,cx-94,uy+288,188,50,25);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`bold 26px ${F}`;
    ctx.fillText(vi?'MUA':'BUY',cx,uy+314);
  });
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  buildMkHits();
}
function buildMkHits(){
  const box=document.getElementById('mkHits');
  if(!box)return;
  box.innerHTML='';
  mkLayout().forEach(sl=>{
    const add=(x,y,w,h)=>{
      const el=document.createElement('div');el.className='cust-hit';
      el.style.left=(x/MK_W*100)+'%';el.style.top=(y/MK_H*100)+'%';
      el.style.width=(w/MK_W*100)+'%';el.style.height=(h/MK_H*100)+'%';
      el.onclick=(ev)=>{ev.preventDefault();openBuyModal(sl.id)};
      box.appendChild(el);
    };
    add(sl.cx-66,sl.uy+18,132,142);
    add(sl.cx-94,sl.uy+288,188,50);
  });
}

const BAGS={hat_nem:{c:'#d79a4a',c2:'#b9772f',lb:'HẠT NÊM',lc:'#e53935'},duong:{c:'#fff8e7',c2:'#eadfc0',lb:'ĐƯỜNG',lc:'#1e88e5'},bot_ngot:{c:'#ffffff',c2:'#dfe6ee',lb:'BỘT NGỌT',lc:'#43a047'}};
function drawBag(ctx,cx,cy,sc,id){
  const B=BAGS[id];ctx.save();
  ctx.fillStyle='rgba(0,0,0,.14)';ctx.beginPath();ctx.ellipse(cx,cy+17*sc,14*sc,3*sc,0,0,Math.PI*2);ctx.fill();
  const body=()=>{ctx.beginPath();ctx.moveTo(cx-4*sc,cy-13*sc);ctx.bezierCurveTo(cx-8*sc,cy-8*sc,cx-17*sc,cy-4*sc,cx-16*sc,cy+6*sc);ctx.bezierCurveTo(cx-16*sc,cy+14*sc,cx-12*sc,cy+17*sc,cx,cy+17*sc);ctx.bezierCurveTo(cx+12*sc,cy+17*sc,cx+16*sc,cy+14*sc,cx+16*sc,cy+6*sc);ctx.bezierCurveTo(cx+17*sc,cy-4*sc,cx+8*sc,cy-8*sc,cx+4*sc,cy-13*sc);ctx.closePath()};
  body();ctx.fillStyle='rgba(235,245,250,.75)';ctx.fill();
  ctx.save();body();ctx.clip();
  const g=ctx.createLinearGradient(cx-16*sc,0,cx+16*sc,0);g.addColorStop(0,B.c2);g.addColorStop(.5,B.c);g.addColorStop(1,B.c2);
  ctx.fillStyle=g;ctx.fillRect(cx-18*sc,cy-6*sc,36*sc,26*sc);
  ctx.fillStyle=id==='hat_nem'?'rgba(120,70,20,.5)':'rgba(120,150,190,.45)';
  for(let i=0;i<14;i++){ctx.beginPath();ctx.arc(cx-12*sc+((i*37)%24)*sc,cy-3*sc+((i*53)%19)*sc,.9*sc,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle=B.lc;ctx.fillRect(cx-11*sc,cy+1*sc,22*sc,9*sc);
  ctx.fillStyle='#fff';ctx.font='800 '+(4.6*sc)+'px "Baloo 2",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(B.lb,cx,cy+5.6*sc);
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.ellipse(cx-9*sc,cy+2*sc,2*sc,9*sc,.15,0,Math.PI*2);ctx.fill();
  ctx.restore();
  body();ctx.strokeStyle='rgba(120,140,160,.85)';ctx.lineWidth=1.1*sc;ctx.stroke();
  ctx.fillStyle=B.c2;ctx.strokeStyle='rgba(120,140,160,.85)';
  ctx.beginPath();ctx.moveTo(cx-4*sc,cy-13*sc);ctx.lineTo(cx-8*sc,cy-18*sc);ctx.lineTo(cx-3*sc,cy-15.5*sc);ctx.lineTo(cx,cy-19*sc);ctx.lineTo(cx+3*sc,cy-15.5*sc);ctx.lineTo(cx+8*sc,cy-18*sc);ctx.lineTo(cx+4*sc,cy-13*sc);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#e53935';ctx.fillRect(cx-4.5*sc,cy-13.5*sc,9*sc,2.4*sc);
  ctx.restore();
}
function stockIconHtml(id,size){
  if(!BAGS[id])return itemIconHtml(id,size);
  const cid='bg_'+id+'_'+Math.random().toString(36).slice(2,7);
  setTimeout(()=>{const c=document.getElementById(cid);if(!c)return;const d=2;c.width=size*d;c.height=size*d;const ctx=c.getContext('2d');ctx.scale(d,d);drawBag(ctx,size/2,size/2+1,size/42,id)},15);
  return `<canvas id="${cid}" style="width:${size}px;height:${size}px;display:block;margin:0 auto"></canvas>`;
}

function refPrice(m){return Math.round(m.priceDef*curArea().pm/500)*500}
function priceExcess(m){return (( S.sell[m.id]||m.priceDef)/refPrice(m)-1)*100}
function priceKeep(menuId){const m=MENU.find(x=>x.id===menuId)||MENU[0],e=priceExcess(m);return e>0?Math.max(.05,1-e/100):Math.min(1.25,1-e/200)}
function avgKeep(){const l=unlockedMenus();return l.reduce((a,m)=>a+priceKeep(m.id),0)/Math.max(1,l.length)}
function ratingMul(){return +(0.4+(S.rating-1)*0.25).toFixed(2)}
function priceCards(){
 let h=`<div class="card"><b style="color:var(--bad)">💰 Giá bán · ${curArea().e} ${curArea().n}</b><br><small>Giá mặt bằng là mức khách khu này quen trả. Bạn đặt cao hơn bao nhiêu % thì số khách còn lại giảm bấy nhiêu % (đặt rẻ hơn thì đông hơn, tối đa +25%). Quán ${S.rating.toFixed(1)}★ → lượng khách ×${ratingMul()}.</small></div>`;
 unlockedMenus().forEach(m=>{
  S.sell[m.id]=clamp(S.sell[m.id]||m.priceDef,Math.floor(m.priceDef*.5),Math.floor(m.priceDef*1.5));
  const p=S.sell[m.id],e=Math.round(priceExcess(m)),k=Math.round(priceKeep(m.id)*100);
  h+=`<div class="card"><div class="row"><div style="width:44px">${itemIconHtml('pho',40)}</div><div class="grow"><b>${menuN(m)}</b><br><small>Giá mặt bằng: ${fmt(refPrice(m))}₫ · tối đa ${fmt(Math.floor(m.priceDef*1.5))}₫</small></div></div>

 });

}

 </svg>`;
}

 <rect x="0" y="246" width="400" height="22" fill="#c62828"/><text x="200" y="262" font-size="13" text-anchor="middle" fill="#ffe14d" font-weight="800" font-family="Baloo 2,sans-serif">VÌ NHÂN DÂN PHỤC VỤ</text>

function policeTab(){
 const th=(S.thieves||[]).filter(x=>x.st==='open'),cs=S.cases||[],found=cs.some(c=>c.st==='found');
 const say=found?'Đã bắt được đối tượng rồi! Anh/chị vào nhận lại tài sản nhé.':th.length?'Có bị mất tiền thì làm đơn trình báo, phường sẽ xác minh.':'Phường mình yên bình, cứ yên tâm buôn bán nhé!';
 const stt={pending:'<span class="chip" style="background:#b48a9c">⏳ Đang xác minh · có kết quả ngày mai</span>',lost:'<span class="chip r">❌ Không tìm ra đối tượng</span>',claimed:'<span class="chip g">✔ Đã nhận lại tiền</span>'};
 const list=cs.map(c=>`<div class="card"><div class="row">${faceCanvasHtml(c.face||FACE_STYLES[0],38)}<div class="grow"><b>${c.n}</b> · <span class="r">${fmt(c.amt)}₫</span><br><small>Ngày ${c.day} · ${c.area}</small><br>${c.st==='found'?'<span class="chip g">✅ Đã bắt được đối tượng</span>':stt[c.st]}</div>${c.st==='found'?`<button class="main" style="background:var(--ok);color:#fff" onclick="claimCase(${c.id})">Nhận ${fmt(c.amt)}</button>`:''}</div></div>`).join('')||'<div class="card"><small>Chưa có hồ sơ trình báo nào.</small></div>';
 return `<div style="padding:8px 12px"><h2 style="margin:4px 0 8px">🚓 Đồn Công An Phường</h2><div class="card" style="padding:0;overflow:hidden">${stationSvg()}</div>
 <div class="card"><div class="row" style="align-items:flex-end"><div style="width:108px;flex:none">${officerSvg()}</div><div class="bub c" style="margin:0"><b>CA Phường:</b> ${say}</div></div></div>
 <button class="pri" style="margin:0 0 10px" onclick="openReport()" ${th.length?'':'disabled'}>📝 Trình báo mất trộm${th.length?` (${th.length} vụ)`:''}</button>
 <div class="sec-label">Hồ sơ vụ việc</div>${list}
 <button class="pri" style="background:var(--line);color:var(--ink);box-shadow:none" onclick="S.tab='map';sfx('click');render()">‹ Về bản đồ</button></div>`;
}
function openReport(){
 const th=(S.thieves||[]).filter(x=>x.st==='open');if(!th.length){toast('Không có ai quỵt tiền');return}
 sfx('click');
 $('#modal').innerHTML=`<div class="mb" style="text-align:left;background:#fffef5;border:4px double #9b2c2c;font-family:Georgia,serif">
 <div style="text-align:center;font-size:11px;letter-spacing:.5px;color:#7a5a1a">CỘNG HÒA XÃ HỘI CHỦ NGHĨA ...<br><b>Độc lập – Tự do – Hạnh phúc</b></div>
 <h3 style="text-align:center;color:#9b2c2c;margin:8px 0 2px;font-family:Georgia,serif">ĐƠN TRÌNH BÁO MẤT TRỘM</h3><div style="text-align:center;font-size:13px">Kính gửi: <b>Công an phường</b></div>
 <div style="font-size:13px;margin-top:8px">Tôi tên là:</div><input id="rpName" maxlength="30" placeholder="Họ và tên người làm đơn">
 <div style="font-size:13px">Chủ cơ sở: <b>${S.name}</b> · Ngày ${S.day}</div>
 <div style="font-size:13px;margin-top:6px"><b>Đối tượng</b> (chọn khách đã bùng tiền):</div>
 ${th.map((x,i)=>`<label style="display:flex;align-items:center;gap:8px;padding:6px;border:2px solid var(--line);border-radius:12px;margin-top:5px;font-size:13px"><input type="radio" name="thf" value="${x.id}" ${i===0?'checked':''} style="width:auto;margin:0"><span class="grow"><b>${x.n}</b>${x.type&&CTYPES[x.type].tag?' '+CTYPES[x.type].tag:''}<br><small>Ngày ${x.day} · ${x.area}</small></span><b class="r">${fmt(x.amt)}₫</b></label>`).join('')}
 <div style="font-size:13px;margin-top:8px">Nội dung sự việc:</div><textarea id="rpText" rows="3" placeholder="Mô tả: khách ăn xong bỏ chạy, không trả tiền..."></textarea>
 <div style="font-size:12px;margin-bottom:6px"><i>Tôi xin cam đoan những nội dung trên là đúng sự thật.</i></div>
 <button class="o main" onclick="submitReport()">Nộp đơn</button><button class="o" onclick="$('#modal').style.display='none'">Hủy</button></div>`;
 $('#modal').style.display='flex';
}
function submitReport(){
 const name=($('#rpName').value||'').trim(),txt=($('#rpText').value||'').trim(),sel=document.querySelector('input[name=thf]:checked');
 if(name.length<2){toast('Chưa điền họ tên');sfx('bad');return}
 if(!sel){toast('Chưa chọn đối tượng');sfx('bad');return}
 if(txt.length<10){toast('Nội dung quá ngắn, mô tả kỹ hơn');sfx('bad');return}
 const th=S.thieves.find(x=>String(x.id)===sel.value);if(!th)return;
 th.st='reported';(S.cases=S.cases||[]).unshift({id:Date.now(),n:th.n,face:th.face,amt:th.amt,day:S.day,area:th.area,reporter:name,content:txt,st:'pending'});
 sfx('bell');save();
 $('#modal').innerHTML=`<div class="mb"><div style="display:flex;justify-content:center;width:120px;margin:auto">${officerSvg()}</div><div class="bub c" style="margin:8px 0">Đơn của <b>${name}</b> đã được tiếp nhận. Phường sẽ xác minh và báo kết quả vào ngày mai. Tiền có về hay không thì… còn tùy vận may.</div><button class="o main" onclick="$('#modal').style.display='none';render()">Cảm ơn đồng chí</button></div>`;
}
function claimCase(id){
 const c=(S.cases||[]).find(x=>x.id===id);if(!c||c.st!=='found')return;
 c.st='claimed';S.money+=c.amt;R().inc+=c.amt;sfx('coin');toast('Nhận lại '+fmt(c.amt)+'₫ từ công an');save();render();
}
function resolveCases(){
 let n=0;(S.cases||[]).forEach(c=>{if(c.st==='pending'&&c.day<S.day){c.st=Math.random()<.5?'found':'lost';n++}});
 if(n)setTimeout(()=>toast('🚓 Công an phường có thông báo mới'),800);
}

/* ===== BOOT ===== */
load();
loadStallBg();
(function runLoading(){
  let p=0;
  const bar=$('#candyBar'),pct=$('#loadPct'),ld=$('#loading'),sub=$('#loadSub');
  if(sub)sub.textContent=t('loading');
  const iv=setInterval(()=>{
    p+=3+Math.random()*4;
    if(p>=100){
      p=100;clearInterval(iv);
      if(bar)bar.style.width='100%';
      if(pct)pct.textContent='100%';
      setTimeout(()=>{
        if(ld){ld.classList.add('hide');setTimeout(()=>{try{ld.remove()}catch(e){}},400)}
        if(!['prep','open','end','bust','name'].includes(S.phase))S.phase='title';
        render();
      },350);
      return;
    }
    if(bar)bar.style.width=p+'%';
    if(pct)pct.textContent=Math.floor(p)+'%';
  },60);
})();
document.body.addEventListener('click',()=>{ensureAudio();tryLoadDefaultBgm();if(musicOn&&soundOn)startBGM()},{once:true});
</script>
